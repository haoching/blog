name: Build and deploy blog

on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  HUGO_VERSION: 0.164.0
  NODE_VERSION: 22.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go for Hugo Modules
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Install publisher dependencies
        working-directory: services/publisher
        run: npm ci

      - name: Test publisher
        working-directory: services/publisher
        run: npm test

      - name: Build publisher
        working-directory: services/publisher
        run: npm run build

      - name: Build Hugo site
        run: bash ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-${{ github.sha }}
          path: public/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-public-${{ github.sha }}
          path: public/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Deploy production Worker
        if: github.ref_name == 'master'
        run: npx wrangler deploy --name blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview Worker
        if: github.ref_name == 'v2'
        run: npx wrangler deploy --name blog-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
